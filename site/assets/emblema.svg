<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="simbolo-titulo">
  <title id="simbolo-titulo">Emblema de Heiner Rincón: un dial de caja fuerte, un anillo abierto con las iniciales HR, un ojo cuya pupila es una cerradura y el fragmento que falta del anillo</title>
  <defs>
    <clipPath id="simbolo-clip-ojo"><path d="M88 200 A146 146 0 0 1 312 200 A146 146 0 0 1 88 200 Z"/></clipPath>
  </defs>

  <!-- Dial de la caja fuerte: gira con el scroll (la combinación) -->
  <g id="simbolo-dial" fill="none" stroke="#5D6672">
    <circle cx="200" cy="200" r="182" stroke-width="6" stroke-dasharray="0.9 14.98" opacity="0.7"/>
    <circle cx="200" cy="200" r="181" stroke-width="10" stroke-dasharray="1.8 93.49" opacity="1"/>
    <circle id="simbolo-indice" cx="200" cy="18" r="3" fill="#F4F6F8" stroke="none"/>
  </g>

  <!-- Órbita punteada -->
  <circle id="simbolo-orbita" cx="200" cy="200" r="160" fill="none" stroke="#DCE1E6" stroke-width="1.2" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.35"/>

  <!-- El todo: anillo abierto + HR -->
  <g id="simbolo-todo">
    <path d="M340.00 200.00 A140 140 0 0 1 229.11 336.94" fill="none" stroke="#DCE1E6" stroke-width="14"/>
    <path d="M170.89 336.94 A140 140 0 1 1 314.68 119.70" fill="none" stroke="#DCE1E6" stroke-width="14"/>
    <g id="simbolo-hr" fill="#DCE1E6" transform="translate(200 340) scale(0.15) translate(-202 -200)">
      <rect x="59" y="80" width="44" height="240"/><rect x="185" y="80" width="44" height="240"/><rect x="103" y="178" width="82" height="44"/>
      <path d="M229 80 H269 A71 71 0 0 1 269 222 H229 V178 H269 A27 27 0 0 0 269 124 H229 Z"/>
      <polygon points="247,222 297,222 345,320 295,320"/>
    </g>
    <!-- Pulso del cierre (rubí claro): invisible en reposo -->
    <circle id="simbolo-pulso" cx="200" cy="200" r="140" fill="none" stroke="#FF7A8E" stroke-width="14" opacity="0"/>
  </g>

  <!-- El ojo: parpadea con scaleY(0.06) sobre el centro (200,200) -->
  <g id="simbolo-ojo">
    <g id="simbolo-horizonte" stroke="#DCE1E6" stroke-width="1.5" opacity="0.45"><line x1="64" y1="200" x2="80" y2="200"/><line x1="320" y1="200" x2="336" y2="200"/></g>
    <path id="simbolo-pliegue" d="M100 190 A113.3 113.3 0 0 1 300 190" fill="none" stroke="#DCE1E6" stroke-width="1.5" opacity="0.4"/>
    <g clip-path="url(#simbolo-clip-ojo)">
      <!-- El iris sigue el cursor: translate x ±28, y ±11 -->
      <g id="simbolo-iris">
        <circle id="simbolo-fibras" cx="200" cy="200" r="33" fill="none" stroke="#8F96A0" stroke-width="18" stroke-dasharray="1.1 3.22" opacity="0.6"/>
        <circle id="simbolo-iris-borde" cx="200" cy="200" r="44" fill="none" stroke="#8F96A0" stroke-width="3.5"/>
        <!-- Pupila: r 22 en reposo, 27 dilatada -->
        <circle id="simbolo-pupila-fondo" cx="200" cy="200" r="22" fill="#0A0B0E"/>
        <!-- Cerradura: rota 90° y escala 1.15 sobre (200,203) al tocarla -->
        <g id="simbolo-pupila" fill="#E23E57">
          <circle cx="200" cy="195" r="6.5"/><polygon points="196.6,199 203.4,199 206,211 194,211"/>
        </g>
      </g>
    </g>
    <path id="simbolo-parpados" d="M88 200 A146 146 0 0 1 312 200 A146 146 0 0 1 88 200 Z" fill="none" stroke="#DCE1E6" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="20"/>
  </g>

  <!-- El fragmento: separado en translate(23,-7); encajado en translate(0,0) -->
  <g id="simbolo-fragmento" transform="translate(23 -7)">
    <path d="M314.68 119.70 A140 140 0 0 1 340.00 200.00" fill="none" stroke="#E23E57" stroke-width="14"/>
    <g id="simbolo-bits">
      <polygon points="342.8,120.0 340.7,123.6 336.5,123.6 334.4,120.0 336.5,116.4 340.7,116.4" fill="none" stroke="#E23E57" stroke-width="1.6"/>
      <rect x="351.9" y="156.0" width="5.2" height="5.2" fill="#F4F6F8"/>
      <polygon points="356.4,188.6 362.9,186.1 358.4,182.6" fill="#DCE1E6" opacity="0.8"/>
    </g>
  </g>
</svg>
