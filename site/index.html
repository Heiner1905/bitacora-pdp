<!doctype html>
<html lang="es-CO" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRAGMENTO.EXE · Bitácora de Heiner Rincón</title>
  <meta name="description" content="Bitácora semanal de Heiner Danit Rincón Carrillo (Ingeniería de Sistemas) para Proyecto de Desarrollo Personal I, 2026-2.">
  <meta name="theme-color" content="#0A0B0E">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="FRAGMENTO.EXE · Bitácora de Heiner Rincón">
  <meta property="og:description" content="Bitácora semanal de Proyecto de Desarrollo Personal I · Ingeniería de Sistemas · 2026-2.">
  <meta property="og:type" content="website">
  <script>
    (function (d) {
      d.classList.replace('no-js', 'js');
      if (location.protocol.indexOf('http') === 0) {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous';
        l.href = 'assets/fonts/zodiak-variable.woff2';
        document.head.appendChild(l);
      }
      /* Estado previo a la entrada (solo con movimiento). Seguro: si el JS falla, todo se ve a los 4 s. */
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        d.classList.add('precarga');
        setTimeout(function () { d.classList.remove('precarga'); }, 4000);
      }
    })(document.documentElement);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Martian+Mono:wdth,wght@75..112.5,300..500&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/encabezado.css">
  <link rel="stylesheet" href="css/portada.css">
  <link rel="stylesheet" href="css/semana.css">
  <link rel="stylesheet" href="css/combinacion.css">
  <link rel="stylesheet" href="css/viz.css">
  <link rel="stylesheet" href="css/cierre-semana.css">
  <link rel="stylesheet" href="css/transiciones.css">
  <link rel="stylesheet" href="css/cierre.css">
  <link rel="stylesheet" href="css/indice.css">
  <link rel="stylesheet" href="css/cursor.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <a class="saltar" href="#semana-01">Saltar a la semana 01</a>

  <!-- ENCABEZADO (js/encabezado.js pinta la marca y las acciones; js/combinacion.js pinta la tira) -->
  <header id="encabezado" class="encabezado" data-solo-js>
    <div id="encabezado-marca" class="encabezado__marca"></div>
    <div id="combinacion" class="combinacion" aria-label="Combinación: semanas recorridas"></div>
    <div id="encabezado-acciones" class="encabezado__acciones"></div>
  </header>

  <!-- ÍNDICE: anillo de N arcos (js/indice.js) -->
  <div id="indice" class="indice" hidden></div>

  <!-- Capa global de partículas (js/particulas.js) -->
  <canvas id="particulas" class="capa-particulas" aria-hidden="true"></canvas>

  <main id="contenido">
    <!-- PORTADA:INICIO — propiedad de js/portada.js + js/simbolo.js. El emblema va INLINE con el contrato de ids. -->
    <section id="portada" class="portada" aria-labelledby="portada-titulo">
      <h1 id="portada-titulo" class="portada__nombre">
        <span class="portada__linea portada__linea--a"><span class="portada__txt" data-campo="nombre-1"></span></span>
        <span class="portada__linea portada__linea--b"><span class="portada__txt" data-campo="nombre-2"></span></span>
        <span class="sr-only" data-campo="nombre-sufijo"></span>
      </h1>

      <div class="portada__escena">
        <div class="portada__camara">
          <div class="portada__emblema">
            <svg class="emblema" id="emblema" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="simbolo-titulo">
              <title id="simbolo-titulo">Emblema de Heiner Rincón: un dial de caja fuerte, un anillo abierto con las iniciales HR, un ojo cuya pupila es una cerradura y el fragmento que falta del anillo</title>
              <defs>
                <clipPath id="simbolo-clip-ojo"><path d="M88 200 A146 146 0 0 1 312 200 A146 146 0 0 1 88 200 Z"/></clipPath>
              </defs>
          
              <!-- Dial de la caja fuerte: gira con el scroll (la combinación) -->
              <g id="simbolo-dial" fill="none" stroke="#5D6672">
                <circle cx="200" cy="200" r="182" stroke-width="6" stroke-dasharray="0.9 14.98" opacity="0.7"/>
                <circle cx="200" cy="200" r="181" stroke-width="10" stroke-dasharray="1.8 93.49" opacity="1"/>
                <circle id="simbolo-indice" cx="200" cy="18" r="3" fill="#F4F6F8" stroke="none"/>
              </g>
          
              <!-- Órbita punteada -->
              <circle id="simbolo-orbita" cx="200" cy="200" r="160" fill="none" stroke="#DCE1E6" stroke-width="1.2" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.35"/>
          
              <!-- El todo: anillo abierto + HR -->
              <g id="simbolo-todo">
                <path d="M340.00 200.00 A140 140 0 0 1 229.11 336.94" fill="none" stroke="#DCE1E6" stroke-width="14"/>
                <path d="M170.89 336.94 A140 140 0 1 1 314.68 119.70" fill="none" stroke="#DCE1E6" stroke-width="14"/>
                <g id="simbolo-hr" fill="#DCE1E6" transform="translate(200 340) scale(0.15) translate(-202 -200)">
                  <rect x="59" y="80" width="44" height="240"/><rect x="185" y="80" width="44" height="240"/><rect x="103" y="178" width="82" height="44"/>
                  <path d="M229 80 H269 A71 71 0 0 1 269 222 H229 V178 H269 A27 27 0 0 0 269 124 H229 Z"/>
                  <polygon points="247,222 297,222 345,320 295,320"/>
                </g>
                <!-- Pulso del cierre (rubí claro): invisible en reposo -->
                <circle id="simbolo-pulso" cx="200" cy="200" r="140" fill="none" stroke="#FF7A8E" stroke-width="14" opacity="0"/>
              </g>
          
              <!-- El ojo: parpadea con scaleY(0.06) sobre el centro (200,200) -->
              <g id="simbolo-ojo">
                <g id="simbolo-horizonte" stroke="#DCE1E6" stroke-width="1.5" opacity="0.45"><line x1="64" y1="200" x2="80" y2="200"/><line x1="320" y1="200" x2="336" y2="200"/></g>
                <path id="simbolo-pliegue" d="M100 190 A113.3 113.3 0 0 1 300 190" fill="none" stroke="#DCE1E6" stroke-width="1.5" opacity="0.4"/>
                <g clip-path="url(#simbolo-clip-ojo)">
                  <!-- El iris sigue el cursor: translate x ±28, y ±11 -->
                  <g id="simbolo-iris">
                    <circle id="simbolo-fibras" cx="200" cy="200" r="33" fill="none" stroke="#8F96A0" stroke-width="18" stroke-dasharray="1.1 3.22" opacity="0.6"/>
                    <circle id="simbolo-iris-borde" cx="200" cy="200" r="44" fill="none" stroke="#8F96A0" stroke-width="3.5"/>
                    <!-- Pupila: r 22 en reposo, 27 dilatada -->
                    <circle id="simbolo-pupila-fondo" cx="200" cy="200" r="22" fill="#0A0B0E"/>
                    <!-- Cerradura: rota 90° y escala 1.15 sobre (200,203) al tocarla -->
                    <g id="simbolo-pupila" fill="#E23E57">
                      <circle cx="200" cy="195" r="6.5"/><polygon points="196.6,199 203.4,199 206,211 194,211"/>
                    </g>
                  </g>
                </g>
                <path id="simbolo-parpados" d="M88 200 A146 146 0 0 1 312 200 A146 146 0 0 1 88 200 Z" fill="none" stroke="#DCE1E6" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="20"/>
              </g>
          
              <!-- El fragmento: separado en translate(23,-7); encajado en translate(0,0) -->
              <g id="simbolo-fragmento" transform="translate(23 -7)">
                <path d="M314.68 119.70 A140 140 0 0 1 340.00 200.00" fill="none" stroke="#E23E57" stroke-width="14"/>
                <g id="simbolo-bits">
                  <polygon points="342.8,120.0 340.7,123.6 336.5,123.6 334.4,120.0 336.5,116.4 340.7,116.4" fill="none" stroke="#E23E57" stroke-width="1.6"/>
                  <rect x="351.9" y="156.0" width="5.2" height="5.2" fill="#F4F6F8"/>
                  <polygon points="356.4,188.6 362.9,186.1 358.4,182.6" fill="#DCE1E6" opacity="0.8"/>
                </g>
              </g>
            </svg>
            <!-- La pupila-cerradura: botón accesible superpuesto (r < 30 del centro) -->
            <button type="button" id="emblema-cerradura" class="portada__cerradura" aria-pressed="false" data-no-imprimir>
              <span class="sr-only" data-etiqueta>Abrir la cerradura del emblema</span>
            </button>
          </div>
        </div>
        <p class="portada__pista" aria-hidden="true" data-no-imprimir></p>
      </div>

      <p class="portada__proposito" data-campo="proposito"></p>

      <dl class="portada__creditos">
        <div class="credito"><dt>Autor</dt><dd data-campo="autor"></dd></div>
        <div class="credito"><dt>Código</dt><dd class="credito__cifra" data-campo="codigo"></dd></div>
        <div class="credito"><dt>Programa</dt><dd><span data-campo="programa"></span><span class="credito__extra" data-campo="semestre"></span></dd></div>
        <div class="credito"><dt>Materia</dt><dd><span data-campo="materia"></span><span class="credito__extra credito__cifra" data-campo="periodo"></span></dd></div>
      </dl>

      <a class="portada__bajar" href="#semana-01" data-no-imprimir>
        <span class="portada__bajar-txt">Desliza para entrar</span>
        <span class="portada__bajar-barra" aria-hidden="true"><span class="portada__bajar-lleno"></span></span>
      </a>

      <noscript>
        <p class="sinjs">Esta bitácora necesita JavaScript para pintar sus textos. Heiner Danit Rincón Carrillo · A00402510 · Ingeniería de Sistemas · Proyecto de Desarrollo Personal I · 2026-2.</p>
      </noscript>
    </section>
    <!-- Recorrido del pin de la entrada por la pupila (alto lo fija portada.js) -->
    <div class="portada__recorrido" aria-hidden="true"></div>
    <!-- Lo que se ve por la cerradura: el plano de la semana 01 (capa fija, solo durante la entrada) -->
    <div class="portada__mirilla" aria-hidden="true" data-no-imprimir></div>
    <svg class="portada__borde" aria-hidden="true" focusable="false" data-no-imprimir><path/></svg>
    <!-- PORTADA:FIN -->

    <!-- SEMANAS: js/semana.js pinta una <section class="semana" data-semana="k"> por semana,
         con su .semana__cierre al final y un .transicion entre semanas -->
    <div id="semanas" class="semanas"></div>

    <!-- CIERRE FINAL (js/cierre.js) -->
    <section id="cierre" class="cierre" aria-label="Cierre de la bitácora"></section>
  </main>

  <footer class="pie">
    <p class="t-dato" data-campo="pie"></p>
  </footer>

  <script defer src="data/semanas.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/simbolo.js"></script>
  <script defer src="js/particulas.js"></script>
  <script defer src="js/portada.js"></script>
  <script defer src="js/semana.js"></script>
  <script defer src="js/combinacion.js"></script>
  <script defer src="js/viz.js"></script>
  <script defer src="js/cierre-semana.js"></script>
  <script defer src="js/transiciones.js"></script>
  <script defer src="js/cierre.js"></script>
  <script defer src="js/encabezado.js"></script>
  <script defer src="js/indice.js"></script>
  <script defer src="js/cursor.js"></script>
  <script defer src="js/arranque.js"></script>
</body>
</html>
